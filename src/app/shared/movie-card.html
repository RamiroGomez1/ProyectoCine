<div>
  @if (pelicula().esPreventa) {
    <span>Preventa</span>
  }

  <img [src]="pelicula().portadaUrl" [alt]="pelicula().titulo" style="width: 100%; border-radius: 8px;">

  <div>
    <div style="display: flex; gap: 8px; margin-top: 8px;">
      <span>{{ pelicula().formato }}</span>
      <span>{{ pelicula().idioma }}</span>
      @if (pelicula().clasificacionEdad > 0) {
        <span>+{{ pelicula().clasificacionEdad }}</span>
      } @else {
        <span>ATP</span>
      }
    </div>

    <h3>{{ pelicula().titulo }}</h3>
    <p>{{ pelicula().generos.join(' • ') }}</p>
    <p>{{ pelicula().duracionMinutos }} min</p>

    <a [routerLink]="['/pelicula', pelicula().id]" style="cursor: pointer; color: blue;">Ver Funciones</a>
  </div>
</div>
