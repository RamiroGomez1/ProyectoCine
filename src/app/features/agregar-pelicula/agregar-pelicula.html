<div class="add-movie-container">
  <h1>🎬 Agregar Nueva Película</h1>

  <form [formGroup]="peliculaForm" (ngSubmit)="guardarPelicula()" class="movie-form">
    
    <div class="form-group">
      <label for="titulo">Título *</label>
      <input type="text" id="titulo" formControlName="titulo" placeholder="Ej: Inception">
      @if (f.titulo.touched && f.titulo.invalid) {
        <small class="error">El título es obligatorio</small>
      }
    </div>

    <div class="form-group">
      <label for="sinopsis">Sinopsis *</label>
      <textarea id="sinopsis" formControlName="sinopsis" placeholder="Sinopsis de la película..."></textarea>
    </div>

    <div class="form-group">
      <label for="duracionMinutos">Duración (minutos) *</label>
      <input type="number" id="duracionMinutos" formControlName="duracionMinutos">
    </div>

    <div class="form-group">
      <label for="formato">Formato *</label>
      <select id="formato" formControlName="formato">
        <option value="2D">2D</option>
        <option value="3D">3D</option>
        <option value="4D">4D</option>
        <option value="5D">5D</option>
      </select>
    </div>

    <div class="form-group">
      <label for="idioma">Idioma *</label>
      <select id="idioma" formControlName="idioma">
        <option value="Castellano">Castellano</option>
        <option value="Subtitulada">Subtitulada</option>
      </select>
    </div>

    <div class="form-group">
      <label for="precioBase">Precio Base ($) *</label>
      <input type="number" id="precioBase" formControlName="precioBase">
    </div>

    <div class="form-group">
      <label for="imagen">Imagen de Portada</label>
      <input type="file" id="imagen" accept="image/*" (change)="seleccionarArchivo($event)">
      
      @if (previewUrl()) {
        <div class="preview">
          <p>Vista previa:</p>
          <img [src]="previewUrl()" alt="Vista previa" width="150">
        </div>
      }
    </div>

    <button type="submit" [disabled]="peliculaForm.invalid || cargando()" class="submit-btn">
      {{ cargando() ? 'Guardando...' : 'Registrar Película' }}
    </button>
  </form>
</div>
