<!-- seat-selection.html -->
<div class="sala-container">
  <div class="pantalla">PANTALLA</div>
  
  @for (fila of sala(); track fila[0].fila) {
    <div class="fila">
      <span class="letra-fila">{{ fila[0].fila }}</span>
      
      @for (butaca of fila; track butaca.id) {
        <button 
          class="butaca"
          [class.vip]="butaca.tipo === 'vip'"
          [class.discapacidad]="butaca.tipo === 'discapacidad'"
          [class.ocupada]="butaca.estado === 'ocupada'"
          [disabled]="butaca.estado === 'ocupada'"
          (click)="seleccionarButaca(butaca)">
          {{ butaca.numero }}
        </button>
      }
    </div>
  } @empty {
    <div class="empty-state">Cargando sala...</div>
  }
</div>
