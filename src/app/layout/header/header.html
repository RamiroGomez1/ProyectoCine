<header class="navbar">
  <div class="brand">
    <h1><a routerLink="/home">Proyecto Cine</a></h1>
  </div>

  <nav class="nav-links">
    <a routerLink="/home" routerLinkActive="active">Inicio</a>
    
    @if (authService.currentUser()) {
      <a routerLink="/favoritos" routerLinkActive="active">Favoritos</a>
      
      @if (authService.currentUserData()?.rol === 'admin') {
        <a routerLink="/admin" routerLinkActive="active" class="admin-badge">
          Panel Admin
        </a>
      }

      <button class="logout-btn" (click)="logout()">Cerrar Sesión</button>
    } @else {
      <a routerLink="/login" routerLinkActive="active">Iniciar Sesión</a>
      <a routerLink="/register" routerLinkActive="active">Registrarse</a>
    }
  </nav>
</header>
